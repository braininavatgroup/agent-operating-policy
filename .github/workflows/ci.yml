name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: ci
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Public-tree denylist
        env:
          PUBLIC_TREE_DENYLIST: ${{ vars.PUBLIC_TREE_DENYLIST }}
        run: python3 tools/public_tree_check.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Committed renderings match policy sources
        run: python3 tools/adapters/check_generation.py
      - name: Public-tree scanner tests
        run: python3 -m unittest tools/tests/test_public_tree_check.py -v
      - name: Adapter tests
        run: python3 -m unittest tools/tests/test_policy_tools.py tools/tests/test_skill_render.py -v
      - name: Skill tests
        run: python3 skills/clean-my-ai-harness/tests/test_harness_evidence.py
      - name: Hook syntax
        run: for f in hooks/*.sh; do bash -n "$f"; done
      - name: Hook spec
        run: bash hooks/browser-launch-guard.test.sh
      - name: Example settings parse
        run: python3 -c "import json; json.load(open('hooks/settings.example.json'))"
